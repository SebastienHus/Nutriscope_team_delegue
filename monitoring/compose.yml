# Sous-projet monitoring : inclus par ../compose.yml via "include".
# Tous les chemins sont relatifs à CE fichier. Services actifs avec : --profile monitoring
services:

  prometheus:
    extends:
      file: ../compose.common.yml
      service: hardened-lite
    image: prom/prometheus:v3.13.4
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [observability]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 200

  loki:
    extends:
      file: ../compose.common.yml
      service: hardened-lite
    image: grafana/loki:3.7.8
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [observability]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 200

  # Alloy lit les logs de tous les conteneurs via le socket Docker et les pousse dans Loki
  alloy:
    image: grafana/alloy:v1.20.1
    profiles: [monitoring]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Attention : l'accès au socket Docker équivaut à quasi-root sur l'hôte (cf. Jour 1)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      loki:
        condition: service_healthy
    networks: [observability]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 200

  # cAdvisor expose les métriques CPU / mémoire / réseau de chaque conteneur
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: [monitoring]
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [observability]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 200

  grafana:
    extends:
      file: ../compose.common.yml
      service: hardened-lite
    image: grafana/grafana:12.4.12
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_MODE: console
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [observability]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
          pids: 200

secrets:
  grafana_admin_password:
    file: ../secrets/grafana_admin_password.txt

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  observability:
