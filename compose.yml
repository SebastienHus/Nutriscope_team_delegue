# ============================================================
#  Stack applicative : web (nginx) -> api (FastAPI) -> db (PostgreSQL) + llm (llama.cpp)
#                      + ollama (embeddings du RAG et juge Flow-Judge) + chroma (base vectorielle du RAG)
#  Usage :
#    dev   : docker compose up -d --build              (charge compose.override.yml)
#    prod  : docker compose -f compose.yml -f compose.prod.yml up -d --build
#    + monitoring : ajouter --profile monitoring
# ============================================================
name: llm-stack

include:
  - path: monitoring/compose.yml        # sous-projet Prometheus / Grafana / Loki (profil "monitoring")

services:

  # ---------- Base de données ----------
  db:
    extends:
      file: compose.common.yml
      service: hardened
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmapp}
      POSTGRES_USER: ${POSTGRES_USER:-llmapp}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
      - /run/postgresql
    # Mémoire partagée des requêtes parallèles (/dev/shm, 64 Mo par défaut dans Docker) : trop juste
    # pour le catalogue complet (1 M de produits). Comptée dans la limite mémoire du conteneur.
    shm_size: 256mb
    # PostgreSQL démarre en root puis bascule sur l'utilisateur "postgres" : il lui faut ces 5 capabilities
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200

  # ---------- Job one-shot : télécharge le modèle GGUF (texte + vision) dans le volume ----------
  # Demande la liste des fichiers du dépôt Hugging Face, prend le modèle à la quantification
  # LLM_QUANT et le module de vision (mmproj) en F16, et les enregistre sous des noms fixes :
  # /models/<LLM_MODEL>.gguf et /models/<LLM_MODEL>-mmproj.gguf. Relancé à chaque "up" :
  # sans téléchargement si les deux fichiers sont déjà là.
  llm-init:
    image: curlimages/curl:8.22.0
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        model="/models/$$LLM_MODEL.gguf"; mmproj="/models/$$LLM_MODEL-mmproj.gguf"
        if [ -s "$$model" ] && [ -s "$$mmproj" ]; then echo "Modèle déjà présent : $$model"; exit 0; fi
        files=$$(curl --fail --silent --show-error --location "https://huggingface.co/api/models/$$LLM_HF_REPO" \
                 | grep -o '"rfilename":"[^"]*\.gguf"' | cut -d'"' -f4)
        model_file=$$(echo "$$files" | grep -iv mmproj | grep -i -- "$$LLM_QUANT" | head -n 1)
        mmproj_file=$$(echo "$$files" | grep -i mmproj | grep -i f16 | head -n 1)
        if [ -z "$$model_file" ] || [ -z "$$mmproj_file" ]; then
          echo "Fichiers introuvables dans $$LLM_HF_REPO (quantification $$LLM_QUANT) :"; echo "$$files"; exit 1
        fi
        for pair in "$$model_file|$$model" "$$mmproj_file|$$mmproj"; do
          file=$${pair%%|*}; target=$${pair#*|}
          [ -s "$$target" ] && continue
          echo "Téléchargement de $$LLM_HF_REPO/$$file (plusieurs Go la première fois)"
          curl --fail --location --retry 5 --continue-at - --output "$$target.part" \
               "https://huggingface.co/$$LLM_HF_REPO/resolve/main/$$file"
          mv "$$target.part" "$$target"
        done
        chown -R 1000:1000 /models
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen3-vl-4b-instruct}
      LLM_HF_REPO: ${LLM_HF_REPO:-Qwen/Qwen3-VL-4B-Instruct-GGUF}
      LLM_QUANT: ${LLM_QUANT:-Q4_K_M}
    volumes:
      - llm_models:/models
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]   # root sans capabilities ne pourrait ni écrire ni faire le chown
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks: [egress]

  # ---------- Serveur LLM (llama.cpp, API compatible OpenAI sur /v1) ----------
  # Un seul modèle, texte + vision, pour l'assistant (appel d'outils : --jinja) et le scanner.
  # Image CPU ici ; compose.gpu.yml passe à l'image CUDA, où le module de vision reste sur le GPU.
  llm:
    extends:
      file: compose.common.yml
      service: hardened
    image: ghcr.io/ggml-org/llama.cpp:server-${LLAMACPP_VERSION:-b11434}
    user: "1000:1000"
    command:
      - --model
      - /models/${LLM_MODEL:-qwen3-vl-4b-instruct}.gguf
      - --mmproj
      - /models/${LLM_MODEL:-qwen3-vl-4b-instruct}-mmproj.gguf
      - --alias
      - ${LLM_MODEL:-qwen3-vl-4b-instruct}       # nom du modèle pour les clients (champ "model")
      - --ctx-size
      - "${LLM_CTX:-4096}"
      - --parallel
      - "1"
      - --n-gpu-layers
      - "${LLM_GPU_LAYERS:-99}"                  # sans GPU, ignoré
      - --threads
      - "${LLM_THREADS:-4}"
      - --jinja                                  # gabarit du modèle : appel d'outils de l'assistant
      - --image-min-tokens
      - "1024"                                   # même découpage de l'image qu'avant (mesures comparables)
      - --metrics                                # /metrics pour Prometheus (réseau observability)
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - llm_models:/models:ro
    tmpfs:
      - /tmp
    depends_on:
      llm-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [inference, observability]
    deploy:
      resources:
        limits:
          cpus: "${LLM_CPUS:-4.0}"
          memory: ${LLM_MEMORY:-12G}
          pids: 1000

  # ---------- Job one-shot : télécharge les modèles Ollama (embeddings + juge) dans le volume ----------
  # Ollama ne sait télécharger qu'en passant par son serveur : ce job lance un serveur temporaire
  # sur le réseau egress, tire les deux modèles dans le volume ollama_models, puis s'arrête.
  # Le service "ollama" lit ensuite ce volume sans accès à Internet. Relancé à chaque "up" :
  # "ollama pull" ne retélécharge rien si le modèle est déjà à jour.
  # Il crée aussi OLLAMA_EMBED_ALIAS : le modèle d'embeddings avec "num_gpu 0", toujours chargé sur
  # le processeur avec OLLAMA_EMBED_THREADS threads, pour laisser la mémoire graphique à llama.cpp
  # (ADR 0003). Le modèle de base reste disponible pour indexer en masse sur le GPU (ADR 0004).
  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-0.30.10}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama serve > /tmp/ollama.log 2>&1 &
        until ollama list > /dev/null 2>&1; do sleep 1; done
        for model in "$$OLLAMA_EMBED_MODEL" "$$OLLAMA_JUDGE_MODEL"; do
          echo "Téléchargement de $$model (plusieurs Go la première fois pour le juge)"
          ollama pull "$$model"
        done
        printf 'FROM %s\nPARAMETER num_gpu 0\nPARAMETER num_thread %s\n' \
          "$$OLLAMA_EMBED_MODEL" "$$OLLAMA_EMBED_THREADS" > /tmp/Modelfile.embed
        ollama create "$$OLLAMA_EMBED_ALIAS" -f /tmp/Modelfile.embed
        ollama list
    environment:
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
      OLLAMA_EMBED_ALIAS: ${OLLAMA_EMBED_ALIAS:-qwen3-embedding-cpu:0.6b}
      # Autant de threads que de processeurs accordés au service ollama (OLLAMA_CPUS) : au-delà, ils se
      # disputent le quota (mesuré : 8 threads sur 4 processeurs, 30 % plus lent que 4 threads)
      OLLAMA_EMBED_THREADS: ${OLLAMA_EMBED_THREADS:-4}
      OLLAMA_JUDGE_MODEL: ${OLLAMA_JUDGE_MODEL:-hf.co/flowaicom/Flow-Judge-v0.1-GGUF:Q4_K_M}
    volumes:
      - ollama_models:/root/.ollama
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"
    networks: [egress]

  # ---------- Serveur Ollama : embeddings du RAG (qwen3-embedding) et juge (Flow-Judge) ----------
  # API native sur /api (POST /api/embed) et compatible OpenAI sur /v1. Sans accès à Internet :
  # les modèles viennent du volume rempli par ollama-init. Le chat et la vision restent sur llama.cpp
  # (ADR 0002) ; ici, ni image ni module de vision, donc pas le problème du mmproj sur le processeur.
  # Embeddings sur le processeur, juge sur le GPU une fois llama.cpp arrêté (évaluation en deux passes).
  ollama:
    extends:
      file: compose.common.yml
      service: hardened
    image: ollama/ollama:${OLLAMA_VERSION:-0.30.10}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}           # libère la mémoire (graphique) après 5 min sans appel
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}  # embeddings (processeur) + juge
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    tmpfs:
      - /tmp
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [inference]
    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPUS:-4.0}"
          memory: ${OLLAMA_MEMORY:-10G}
          pids: 1000

  # ---------- Base vectorielle du RAG (Chroma, mode serveur) ----------
  # Deux collections : "sheets" (une fiche par produit) et "documents" (morceaux des documents de
  # référence), remplies par "python -m nutriscope.rag.index" (ADR 0004). Les vecteurs sont calculés
  # par ollama (qwen3-embedding) et fournis à Chroma : il ne calcule aucun embedding lui-même.
  # L'image n'a ni curl ni wget : le healthcheck interroge /api/v2/heartbeat par /dev/tcp de bash.
  chroma:
    extends:
      file: compose.common.yml
      service: hardened
    image: chromadb/chroma:${CHROMA_VERSION:-1.5.9}
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"          # aucune télémétrie (le réseau est interne de toute façon)
    volumes:
      - chroma_data:/data                    # persist_path du /config.yaml de l'image
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [inference]
    deploy:
      resources:
        limits:
          cpus: "${CHROMA_CPUS:-2.0}"
          memory: ${CHROMA_MEMORY:-2G}
          pids: 500

  # ---------- API ----------
  api:
    extends:
      file: compose.common.yml
      service: hardened
    build:
      context: ./api
      target: runner
    image: llm-stack/api:${APP_VERSION:-dev}
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-llmapp}
      DB_USER: ${POSTGRES_USER:-llmapp}
      DB_PASSWORD_FILE: /run/secrets/db_password
      LLM_URL: http://llm:8080
      LLM_MODEL: ${LLM_MODEL:-qwen3-vl-4b-instruct}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - db_password
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [frontend, backend, inference, observability]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 200

  # ---------- Front web (nginx non-root) ----------
  web:
    extends:
      file: compose.common.yml
      service: hardened
    build:
      context: ./web
    image: llm-stack/web:${APP_VERSION:-dev}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [frontend]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 200

  # ---------- Sauvegarde logique (profil "backup") ----------
  # docker compose --profile backup run --rm db-backup
  db-backup:
    image: postgres:16-alpine
    profiles: [backup]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-llmapp}
      PGDATABASE: ${POSTGRES_DB:-llmapp}
      PGPASSFILE: /tmp/.pgpass
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "db:5432:$$PGDATABASE:$$PGUSER:$$(cat /run/secrets/db_password)" > "$$PGPASSFILE"
        chmod 600 "$$PGPASSFILE"
        out="/backups/dump-$$(date +%Y%m%d-%H%M%S).sql.gz"
        pg_dump | gzip > "$$out"
        echo "Sauvegarde créée : $$out"
    secrets:
      - db_password
    volumes:
      - ./backups:/backups
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend]

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pgdata:
  llm_models:
  ollama_models:
  chroma_data:

networks:
  frontend:
  backend:
    internal: true        # la base n'a aucun accès à Internet ni à l'hôte
  inference:
    internal: true        # le serveur LLM n'a aucun accès à Internet
  egress:                 # seul llm-init sort sur Internet (téléchargement du modèle)
