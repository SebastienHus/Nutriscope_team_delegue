[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriscope"
version = "0.3.0"
description = "NutriScope: Open Food Facts cleaning, storage and Nutri-Score prediction"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
nutriscope-pipeline = "nutriscope.pipeline:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nutriscope = ["options.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
